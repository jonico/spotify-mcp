asyncapi: 3.0.0
info:
  title: Plain text event (Kafka Broker Tests)
  version: 1.0.0
  description: 'Topic written by Produce text-none: a text key and a plain text value, no compression, acks leader.'
servers:
  kafka:
    host: '{{kafka_bootstrap}}'
    protocol: kafka
    description: A local single-node broker; kafka_bootstrap defaults to 127.0.0.1:9092.
channels:
  event:
    address: kt-text-none-{{run_id}}
    description: One topic per run.
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  sendEvent:
    action: send
    channel:
      $ref: '#/channels/event'
    summary: Produce the message (request Produce text-none)
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/event'
    summary: Read the record back from the start of the topic (request Consume text-none)
components:
  messages:
    Event:
      name: Event
      title: Plain text event (Kafka Broker Tests)
      contentType: text/plain
      bindings:
        kafka:
          key:
            type: string
            description: A plain text key.
            examples:
            - plain-key
      payload:
        $ref: '#/components/schemas/EventPayload'
      examples:
      - name: example
        payload: hello kafka
  schemas:
    EventPayload:
      type: string
      description: A plain UTF-8 text value.
      examples:
      - hello kafka
