asyncapi: 3.0.0
info:
  title: Tombstone (Kafka Broker Tests)
  version: 1.0.0
  description: 'Topic written by Produce tombstone: a record with a key and no value, which marks the key as deleted
    in a compacted topic.'
servers:
  kafka:
    host: '{{kafka_bootstrap}}'
    protocol: kafka
    description: A local single-node broker; kafka_bootstrap defaults to 127.0.0.1:9092.
channels:
  event:
    address: kt-tombstone-{{run_id}}
    description: One topic per run.
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  sendEvent:
    action: send
    channel:
      $ref: '#/channels/event'
    summary: Produce the message (request Produce tombstone)
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/event'
    summary: Read the record back from the start of the topic (request Consume tombstone)
components:
  messages:
    Event:
      name: Event
      title: Tombstone (Kafka Broker Tests)
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: The key being deleted.
            examples:
            - gone
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: 'null'
      description: 'No value: a tombstone.'
