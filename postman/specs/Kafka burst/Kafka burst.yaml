asyncapi: 3.0.0
info:
  title: Numbered burst event (Kafka Broker Tests)
  version: 1.0.0
  description: 'Topic written by the three Produce burst requests: one record each, numbered 1 to 3, read back in
    order by Consume burst.'
servers:
  kafka:
    host: '{{kafka_bootstrap}}'
    protocol: kafka
    description: A local single-node broker; kafka_bootstrap defaults to 127.0.0.1:9092.
channels:
  event:
    address: kt-burst-{{run_id}}
    description: One topic per run.
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  sendEvent:
    action: send
    channel:
      $ref: '#/channels/event'
    summary: Produce the message (request Produce burst 1 to 3)
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/event'
    summary: Read the record back from the start of the topic (request Consume burst)
components:
  messages:
    Event:
      name: Event
      title: Numbered burst event (Kafka Broker Tests)
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: burst-1, burst-2 or burst-3.
            examples:
            - burst-1
      payload:
        $ref: '#/components/schemas/EventPayload'
      examples:
      - name: example
        payload:
          seq: 1
  schemas:
    EventPayload:
      type: object
      description: A sequence number.
      required:
      - seq
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 3
          description: Position in the burst
