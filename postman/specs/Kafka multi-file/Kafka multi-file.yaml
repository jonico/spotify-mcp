asyncapi: 3.0.0
info:
  title: Text event, two message files (Kafka Broker Tests)
  version: 1.0.0
  description: Topic written by Produce multi-file, a request that owns two message files. The CLI sends only the
    first per run.
servers:
  kafka:
    host: '{{kafka_bootstrap}}'
    protocol: kafka
    description: A local single-node broker; kafka_bootstrap defaults to 127.0.0.1:9092.
channels:
  event:
    address: kt-multi-file-{{run_id}}
    description: One topic per run.
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  sendEvent:
    action: send
    channel:
      $ref: '#/channels/event'
    summary: Produce the message (request Produce multi-file)
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/event'
    summary: Read the record back from the start of the topic (request Consume multi-file)
components:
  messages:
    Event:
      name: Event
      title: Text event, two message files (Kafka Broker Tests)
      contentType: text/plain
      bindings:
        kafka:
          key:
            type: string
            description: multi-1 or multi-2.
            examples:
            - multi-1
      payload:
        $ref: '#/components/schemas/EventPayload'
      examples:
      - name: example
        payload: file 1
  schemas:
    EventPayload:
      type: string
      description: A plain UTF-8 text value.
      examples:
      - file 1
