$kind: http-request
name: Single track read works
description: |-
  The per-track route that `get_tracks` falls back to when batching is
  withheld. If this ever breaks, track lookup has no working path at all.
method: GET
url: https://api.spotify.com/v1/tracks/6ADPS6h7kuqZwqekUrLTEp
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("single track is readable", () => pm.response.to.have.status(200));
      const t = pm.response.json();
      pm.test("returns the track asked for", () => pm.expect(t.id).to.eql("6ADPS6h7kuqZwqekUrLTEp"));
      pm.test("album is present for release_date parsing", () => pm.expect(t.album).to.be.an("object"));
order: 6000
