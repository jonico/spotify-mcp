$kind: kafka-request
description: "**Variant:** base64 key and value, snappy, acks all. Produces one message to `kt-base64-snappy-{{run_id}}`."
mode: producer
url:
  - "{{kafka_bootstrap}}"
acknowledgements: all
settings:
  compression: snappy
messages: ./.resources/Produce base64-snappy.resources/messages
scripts:
  - type: afterProduce
    code: |-
      const r = pm.response;
      pm.test("base64 key and value, snappy, acks all: produced without error", function () { pm.expect(r.error, "error").to.equal(undefined); });
      pm.test("base64 key and value, snappy, acks all: lands on the variant's topic", function () { pm.expect(r.topic).to.equal("kt-base64-snappy-" + pm.collectionVariables.get("run_id")); });
      pm.test("base64 key and value, snappy, acks all: broker returns a partition", function () { pm.expect(r.partition).to.be.a("number"); });
      pm.test("base64 key and value, snappy, acks all: broker returns a numeric offset", function () { pm.expect(r.offset).to.match(/^\d+$/); });
order: 7000
