$kind: kafka-request
description: |-
  **Variant:** tombstone: a key and no value. Reads the record back from the start of the topic.
mode: consumer
url:
  - "{{kafka_bootstrap}}"
topics:
  - name: kt-tombstone-{{run_id}}
startPosition:
  type: beginning
stopAfter:
  maxRecords: 1
  maxDurationMs: 20000
scripts:
  - type: onIncomingMessage
    code: |-
      const m = pm.message;
      pm.test("tombstone: a key and no value: record comes from the variant's topic, partition and offset 0", function () {
        pm.expect(m.topic).to.equal("kt-tombstone-" + pm.collectionVariables.get("run_id"));
        pm.expect(m.partition).to.be.a("number");
        pm.expect(m.offset).to.equal("0");
      });
      pm.test("tombstone: a key and no value: key round-trips", function () { pm.expect(m.key).to.equal("gone"); });
      pm.test("tombstone: a key and no value: a tombstone arrives with no value (the broker stores null; scripts see undefined)", function () { pm.expect(m.value).to.equal(undefined); });
      pm.test("tombstone: a key and no value: record has a broker timestamp", function () { pm.expect(m.timestamp).to.be.a("number").above(0); });
  - type: afterConsume
    code: |-
      pm.test("tombstone: a key and no value: consume stops because maxRecords was reached", function () { pm.expect(pm.response.reason).to.equal("maxRecords"); });
      pm.test("tombstone: a key and no value: exactly one record was received", function () { pm.expect(pm.response.messages.members).to.have.lengthOf(1); });
order: 12000
