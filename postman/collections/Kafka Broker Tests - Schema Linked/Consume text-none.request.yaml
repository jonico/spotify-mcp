$kind: kafka-request
description: |-
  **Variant:** text value, no compression, acks leader. Reads the record back from the start of the topic.
mode: consumer
url:
  - "{{kafka_bootstrap}}"
topics:
  - name: kt-text-none-{{run_id}}
    schema:
      source: specification
      specificationId: ../postman/specs/Kafka text-none/Kafka text-none.yaml
startPosition:
  type: beginning
stopAfter:
  maxRecords: 1
  maxDurationMs: 20000
scripts:
  - type: onIncomingMessage
    code: |-
      const m = pm.message;
      pm.test("text value, no compression, acks leader: record comes from the variant's topic, partition and offset 0", function () {
        pm.expect(m.topic).to.equal("kt-text-none-" + pm.collectionVariables.get("run_id"));
        pm.expect(m.partition).to.be.a("number");
        pm.expect(m.offset).to.equal("0");
      });
      pm.test("text value, no compression, acks leader: key round-trips", function () { pm.expect(m.key).to.equal("plain-key"); });
      pm.test("text value, no compression, acks leader: value round-trips", function () { pm.expect(m.value).to.deep.equal("hello kafka"); });
      pm.test("text value, no compression, acks leader: record has a broker timestamp", function () { pm.expect(m.timestamp).to.be.a("number").above(0); });
  - type: afterConsume
    code: |-
      pm.test("text value, no compression, acks leader: consume stops because maxRecords was reached", function () { pm.expect(pm.response.reason).to.equal("maxRecords"); });
      pm.test("text value, no compression, acks leader: exactly one record was received", function () { pm.expect(pm.response.messages.members).to.have.lengthOf(1); });
order: 4000
