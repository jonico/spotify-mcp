$kind: kafka-request
description: "**Variant:** burst message 3 of 3, all to the same topic."
mode: producer
url:
  - "{{kafka_bootstrap}}"
acknowledgements: all
settings:
  compression: none
messages: ./.resources/Produce burst 3.resources/messages
scripts:
  - type: afterProduce
    code: |-
      pm.test("burst 3: produced without error", function () { pm.expect(pm.response.error, "error").to.equal(undefined); });
      pm.test("burst 3: gets offset 2", function () { pm.expect(pm.response.offset).to.equal("2"); });
order: 17000
