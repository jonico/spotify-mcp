$kind: kafka-request
description: |-
  **Deliberate schema violation, expected to fail.** Sends {"id": 1} to the topic of the linked spec `Kafka json-gzip`,
  which says: status is required. The second assertion fails by design; the first fails only if the app rejects the send.
mode: producer
url:
  - "{{kafka_bootstrap}}"
acknowledgements: all
messages: .resources/Violation - json-gzip status missing.resources/messages
scripts:
  - type: afterProduce
    code: |-
      const r = pm.response;
      const v = r.value !== undefined ? r.value : {"id": 1};
      pm.test("Violation - json-gzip status missing: the app accepts the send (goes red if the app enforces the linked schema)", function () { pm.expect(r.error, "error").to.equal(undefined); });
      pm.test("Violation - json-gzip status missing: EXPECTED TO FAIL: the value breaks the linked schema (status is required)", function () { pm.expect(typeof v.status === "string", "status is required").to.equal(true); });
order: 301000
