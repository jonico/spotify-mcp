$kind: mcp-request
description: |-
  **Purpose:** a tool name the server does not have. **Expected:** a result with `isError: true` naming the tool.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "no_such_tool",
      "arguments": {}
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const text = res.content && res.content[0] ? String(res.content[0].text) : "";
      pm.test("unknown tool is reported as a tool error, not a transport failure", function () {
        pm.expect(res.isError).to.equal(true);
        pm.expect(text).to.include("no_such_tool");
      });
settings:
  version: auto
  requestTimeout: 60000
order: 2000
