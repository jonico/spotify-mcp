$kind: mcp-request
description: |-
  **Purpose:** page the user's Liked Songs library.

  **Result:** `total: 2` — "Und dann kommt ein Mensch" — Major Sunburn (added
  2026-08-25T15:16:05Z, by the "Like track" request in this collection) and
  "Labyrinth of Mirrors" — Aimoon, Victor Tayne (added 2026-08-24T17:21:45Z).

  Unlike playlists, this endpoint reports `total` honestly.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_saved_tracks",
      "arguments": {
        "limit": 5,
        "offset": 0
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("every item is a track with id, name and artist", function () {
        pm.expect(sc.items).to.be.an("array").that.is.not.empty;
        sc.items.forEach(function (t) {
          pm.expect(t.id, "id").to.be.a("string");
          pm.expect(t.name, "name").to.be.a("string");
          pm.expect(t.artist, "artist").to.be.a("string");
        });
      });
      pm.test("every liked song has added_at", function () { sc.items.forEach(function (t) { pm.expect(t.added_at, t.id).to.be.a("string"); }); });
      pm.test("page carries total, limit and offset", function () {
        pm.expect(sc.items).to.be.an("array");
        pm.expect(sc.total).to.be.a("number");
        pm.expect(sc.limit).to.be.a("number");
        pm.expect(sc.offset).to.be.a("number");
      });
settings:
  version: auto
  requestTimeout: 0
order: 31000
