$kind: mcp-request
description: |-
  **Purpose:** fetch artist metadata plus top tracks.

  **Result:** the artist, with `genres: []` and `popularity`/`followers` null.
  `top_tracks` is always `[]` — Spotify withholds top tracks from this app, and the tool
  returns the artist anyway rather than failing on it.

  On the published PyPI build this tool fails outright with
  `Playback is restricted for this content [playback_restricted]` for every artist,
  including valid IDs. If that is what you get, the build is older than the fix.

  For artist metadata without the top-tracks call at all, use the `spotify://artist/{id}`
  resource — see "Artist Resource" in this collection.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_artist",
      "arguments": {
        "artist_ids": ["5gY5PFULD9iPkwMzZrYRAV"]
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("one artist entry per id", function () { pm.expect(sc.artists).to.be.an("array").with.lengthOf(1); });
      pm.test("artists is a list of entries with id and name", function () {
        pm.expect(sc.artists).to.be.an("array");
        sc.artists.forEach(function (e) { pm.expect(e.id, "id").to.be.a("string"); pm.expect(e.name, "name").to.be.a("string"); });
      });
settings:
  version: auto
  requestTimeout: 0
order: 18000
