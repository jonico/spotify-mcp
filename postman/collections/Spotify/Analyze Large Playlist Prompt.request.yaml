$kind: mcp-request
description: |-
  **Purpose:** the `analyze_large_playlist` prompt — a pagination strategy for playlists
  too big to read in one go.

  **Result** (read from the prompt implementation): returns a 3-step template —
  `get_playlist_info` for size, then `get_playlist_tracks` in 100-track pages, then
  analysis branching on `analysis_type` (overview / detailed / duplicates / mood).

  Caveat: step 1 tells the client to read `total_tracks`, which currently returns null
  (see "Playlist info"), and `get_playlist_tracks` reports `total` as the page size rather
  than the playlist length. Both defects undercut this prompt's pagination advice.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "prompts/get",
    "params": {
      "name": "analyze_large_playlist",
      "arguments": {
        "playlist_id": "4rtBfFS2LRXA7jFbLhyDjJ",
        "analysis_type": "overview"
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 42000
