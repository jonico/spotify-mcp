$kind: mcp-request
description: |-
  **Purpose:** the signed-in user's profile via the `get_me` tool.

  **Result:** id `31et4tmmf46ixoe7tltp43sjxvk4`, Johannes Nicolai,
  `nicolai.johannes@googlemail.com`, country DE, product **premium**, followers 0.

  `email`, `country` and `product` are all populated, confirming full/legacy regime —
  under the restricted regime these come back empty rather than erroring.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_me",
      "arguments": {}
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("profile has id and display_name", function () {
        pm.expect(sc.id).to.be.a("string");
        pm.expect(sc.display_name).to.be.a("string");
      });
settings:
  version: auto
  requestTimeout: 0
order: 19000
