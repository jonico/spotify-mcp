$kind: mcp-request
description: |-
  **Purpose:** the `discover_music_systematically` prompt — deliberate use of search
  offsets to reach past the popular head of the results.

  **Result** (read from the prompt implementation): returns a template that walks
  offsets in bands (0-20 popular, 20-60 hidden gems, 80-100+ deep cuts), suggests derived
  queries from artist/album/genre/decade, scales effort by
  `exploration_depth` (light/medium/deep), and targets 15-25 curated tracks.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "prompts/get",
    "params": {
      "name": "discover_music_systematically",
      "arguments": {
        "seed_query": "melancholic 90s trance",
        "exploration_depth": "deep"
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 43000
