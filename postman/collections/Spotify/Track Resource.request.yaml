$kind: mcp-request
description: |-
  **Purpose:** a single track by ID, via the templated resource
  `spotify://track/{track_id}`.

  **Result:** the full track JSON — same shape as one element of
  `get_track_info`'s `tracks` array.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "resources/read",
    "params": {
      "uri": "spotify://track/6ADPS6h7kuqZwqekUrLTEp"
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 37000
