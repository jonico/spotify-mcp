$kind: mcp-request
description: |-
  **Purpose:** fetch the `taste_profile` prompt with default arguments
  (`time_range` defaults to medium_term).

  **Result** (read from the prompt implementation): returns text instructing the
  client to combine `get_top_items` for both artists and tracks with
  `get_recently_played`, then report dominant genres/moods, recent shifts, and blind
  spots.

  Note the dependency: this prompt leans on `get_top_items`, which currently returns
  far fewer items than requested (see "Top artists").
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "prompts/get",
    "params": {
      "name": "taste_profile",
      "arguments": {}
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 12000
