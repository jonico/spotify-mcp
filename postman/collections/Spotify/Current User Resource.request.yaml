$kind: mcp-request
description: |-
  **Purpose:** read the `spotify://user/current` MCP **resource** — the resource-shaped
  counterpart to the `get_me` tool.

  **Result:** `text/plain` body containing
  `{"id": "31et4tmmf46ixoe7tltp43sjxvk4", "display_name": "Johannes Nicolai",
  "followers": 0, "country": "DE", "product": "premium"}`.

  Worth noting: `country` and `product` are populated here. Those are among the fields the
  Feb 2026 restricted regime strips, so this app is currently on the full/legacy regime.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "resources/read",
    "params": {
      "uri": "spotify://user/current"
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 9000
