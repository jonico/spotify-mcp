$kind: mcp-request
description: |-
  **Purpose:** track search, exercising the optional filter arguments
  (`year`, `year_range`, `genre`, `artist`, `album`) explicitly passed as null.

  **Result:** `total: 12`. Top hit is the exact match —
  "Und dann kommt ein Mensch" — Major Sunburn (`6ADPS6h7kuqZwqekUrLTEp`, 2026-01-22).
  Explicit nulls are accepted rather than rejected.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "search_music",
      "arguments": {
        "query": "Und dann kommt ein Mensch",
        "qtype": "track",
        "limit": 10,
        "offset": 0,
        "year": null,
        "year_range": null,
        "genre": null,
        "artist": null,
        "album": null
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("every item is a track with id, name and artist", function () {
        pm.expect(sc.items).to.be.an("array").that.is.not.empty;
        sc.items.forEach(function (t) {
          pm.expect(t.id, "id").to.be.a("string");
          pm.expect(t.name, "name").to.be.a("string");
          pm.expect(t.artist, "artist").to.be.a("string");
        });
      });
      pm.test("returns no more items than limit", function () { pm.expect(sc.items.length).to.be.at.most(sc.limit); });
      pm.test("page carries limit, offset and a numeric total", function () {
        pm.expect(sc.total).to.be.a("number"); pm.expect(sc.limit).to.be.a("number"); pm.expect(sc.offset).to.be.a("number");
      });
settings:
  version: auto
  requestTimeout: 0
order: 6000
