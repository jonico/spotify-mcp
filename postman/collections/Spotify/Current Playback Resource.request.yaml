$kind: mcp-request
description: |-
  **Purpose:** playback state as an MCP **resource** rather than a tool call.

  **Result:** `is_playing: true`, track (name/artist/album/id), device
  `PM-MYKFWG6W19`, `progress_ms: 103761`.

  Deliberately slimmer than the `get_playback_state` tool: no `volume`, `shuffle` or
  `repeat`. Use the resource for cheap context, the tool when you need the full state.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "resources/read",
    "params": {
      "uri": "spotify://playback/current"
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      pm.test("read succeeds with exactly one content entry", function () { pm.expect(res.contents).to.be.an("array").with.lengthOf(1); });
      pm.test("content echoes the requested uri", function () { pm.expect(res.contents[0].uri).to.equal("spotify://playback/current"); });
      pm.test("content has a mimeType and non-empty text", function () {
        pm.expect(res.contents[0].mimeType).to.be.a("string");
        pm.expect(res.contents[0].text).to.be.a("string").and.not.empty;
      });
      pm.test("JSON content parses", function () {
        if (/json/.test(res.contents[0].mimeType)) { pm.expect(JSON.parse(res.contents[0].text)).to.be.an("object"); }
      });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      const info = res._meta && res._meta["io.modelcontextprotocol/serverInfo"];
      pm.test("result carries serverInfo with a semver version", function () {
        pm.expect(info, "serverInfo").to.be.an("object");
        pm.expect(info.name).to.be.a("string");
        pm.expect(info.version).to.match(/^\d+\.\d+\.\d+/);
      });
settings:
  version: auto
  requestTimeout: 0
order: 36000
