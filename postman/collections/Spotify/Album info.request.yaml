$kind: mcp-request
description: |-
  **Purpose:** album metadata plus its track list.

  **Result:** "Und dann kommt ein Mensch" — Major Sunburn, `album_type: single`,
  `total_tracks: 1`, released 2026-01-22 (`release_date_precision: day`), and the single
  track inline. `label`, `popularity` null and `genres` empty.

  Contrast with `get_artist`: this tool also makes a second upstream call (for
  tracks) but that one still works, so albums are fine where artists are not.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_album",
      "arguments": {
        "album_ids": ["7y8mOM5mWNSAean59dK3co"]
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("one album entry per id", function () { pm.expect(sc.albums).to.be.an("array").with.lengthOf(1); });
      pm.test("albums is a list of entries with id and name", function () {
        pm.expect(sc.albums).to.be.an("array");
        sc.albums.forEach(function (e) { pm.expect(e.id, "id").to.be.a("string"); pm.expect(e.name, "name").to.be.a("string"); });
      });
settings:
  version: auto
  requestTimeout: 0
order: 30000
