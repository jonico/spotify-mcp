$kind: mcp-request
description: |-
  **Purpose:** ask whether specific tracks are in the Liked Songs library, without
  paging it. Takes up to 50 ids and answers in one request.

  **Result:** `results`, a map of track id to boolean, plus `checked` — the number of
  ids answered. Not a positional list: read each id out of the map by key.

  Both ids here read `true`; they are the tracks the "Like track" request saves.

  Prefer this over walking `get_saved_tracks` when the question is membership rather
  than contents — a large library costs many pages to answer the same thing.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "check_saved_tracks",
      "arguments": {
        "track_ids": ["6ADPS6h7kuqZwqekUrLTEp", "5LSKH85Ww52Jpg0UfSkUou"]
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 48000
