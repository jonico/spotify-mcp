$kind: mcp-request
description: |-
  **Purpose:** the user's top artists over ~6 months. With `/recommendations`,
  audio-features and related-artists withdrawn from third-party apps, this plus
  `get_recently_played` is the measured foundation for any suggestion feature.

  **Result:** up to `limit` artists, each with `genres: []` and `popularity`/`followers`
  null. `tracks` is null, as expected when `item_type` is artists.

  Expect fewer than `limit` results on an account with little listening history — the tool
  returns what the history holds, and a short count here does not indicate a truncated
  response.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_top_items",
      "arguments": {
        "item_type": "artists",
        "time_range": "medium_term",
        "limit": 5
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("artists is a list of entries with id and name", function () {
        pm.expect(sc.artists).to.be.an("array");
        sc.artists.forEach(function (e) { pm.expect(e.id, "id").to.be.a("string"); pm.expect(e.name, "name").to.be.a("string"); });
      });
      pm.test("time_range is reported", function () { pm.expect(sc.time_range).to.be.a("string"); });
settings:
  version: auto
  requestTimeout: 0
order: 35000
