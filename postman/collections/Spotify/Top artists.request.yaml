$kind: mcp-request
description: |-
  **Purpose:** the user's top artists over ~6 months. With `/recommendations`,
  audio-features and related-artists withdrawn from third-party apps, this plus
  `get_recently_played` is the measured foundation for any suggestion feature.

  **Result:** up to `limit` artists, each with `genres: []` and `popularity`/`followers`
  null. `tracks` is null, as expected when `item_type` is artists.

  Expect fewer than `limit` results on an account with little listening history — the tool
  returns what the history holds, and a short count here does not indicate a truncated
  response.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_top_items",
      "arguments": {
        "item_type": "artists",
        "time_range": "medium_term",
        "limit": 5
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 35000
