$kind: mcp-request
description: |-
  **Purpose:** save (like) a track into the user's library. Additive, not destructive —
  `destructiveHint` is correctly false.

  **Result:** `{"status": "success", "message": "Saved 1 track(s)",
  "snapshot_id": null}`. Library went from 1 to 2 saved tracks; the new entry carries
  `added_at: 2026-08-25T15:16:05Z`.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "save_tracks",
      "arguments": {
        "track_ids": [
          "6ADPS6h7kuqZwqekUrLTEp"
        ]
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 13000
