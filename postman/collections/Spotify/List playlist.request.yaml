$kind: mcp-request
description: |-
  **Purpose:** list the signed-in user's playlists, first page.

  **Result:** `total: 5` — Melancholic 90s Trance, Game of Thrones Soundtrack
  (All Seasons) (owner: Low Fidelity), Lilli & Thomas (owner: thomasbrits), "Backstreet
  Boys, Avril Lavigne, Michael Jackson, Taylor Swift", My playlist #1.

  Known defect: `tracks` and `total_tracks` come back `null` for every entry, so this
  response cannot be used to find the largest playlist.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "list_playlists",
      "arguments": {
        "limit": 20,
        "offset": 0
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("every item is a playlist with id, name and owner", function () {
        pm.expect(sc.items).to.be.an("array").that.is.not.empty;
        sc.items.forEach(function (p) {
          pm.expect(p.id, "id").to.be.a("string");
          pm.expect(p.name, "name").to.be.a("string");
          pm.expect(p.owner, "owner").to.be.a("string");
        });
      });
      pm.test("KNOWN QUIRK: total_tracks is withheld (null) on every entry", function () {
        sc.items.forEach(function (p) { pm.expect(p.total_tracks, p.id).to.equal(null); });
      });
settings:
  version: auto
  requestTimeout: 0
order: 11000
