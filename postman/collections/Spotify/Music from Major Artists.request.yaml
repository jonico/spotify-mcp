$kind: mcp-request
description: |-
  **Purpose:** artist-type search (`qtype: artist`) rather than track search.

  **Result:** `total: 11`; top hit Major Sunburn
  (`5zbSsk4Qg514fYzb3KhQX7`). Other hits are fuzzy name matches (Sunbeam, Major Lazer,
  Major Moment, Peter Schilling).

  Shape note: artist results populate only `name`, `id`, `artist` and `external_urls` —
  `album`, `artists`, `duration_ms` and `release_date` are all null, because those fields
  do not apply to an artist.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "search_music",
      "arguments": {
        "query": "Major Sunburn",
        "qtype": "artist",
        "limit": 10
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("every item is an artist with id, name and artist", function () {
        pm.expect(sc.items).to.be.an("array").that.is.not.empty;
        sc.items.forEach(function (artist) {
          pm.expect(artist.id, "id").to.be.a("string");
          pm.expect(artist.name, "name").to.be.a("string");
          pm.expect(artist.artist, "artist").to.be.a("string");
        });
      });
      pm.test("Major Sunburn is explicitly included", function () {
        const majorSunburn = sc.items.find(function (artist) {
          return artist.name === "Major Sunburn" && artist.id === "5zbSsk4Qg514fYzb3KhQX7";
        });
        pm.expect(majorSunburn, "Major Sunburn artist result").to.exist;
      });
    language: text/javascript
settings:
  version: auto
  requestTimeout: 0
order: 17000
