$kind: mcp-request
description: |-
  **Purpose:** playlist metadata *without* tracks — the cheap counterpart to
  "Show playlist details".

  **Result:** "Backstreet Boys, Avril Lavigne, Michael Jackson, Taylor Swift",
  owner Johannes Nicolai, `public: true`.

  Known defect: `tracks` and `total_tracks` are both null even though the playlist holds
  65 tracks — so the documented way to "check total_tracks to understand playlist size"
  (see the `analyze_large_playlist` prompt) does not currently work.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_playlist",
      "arguments": {
        "playlist_id": "4rtBfFS2LRXA7jFbLhyDjJ"
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("playlist has id, name, owner and a numeric total_tracks", function () {
        pm.expect(sc.id).to.be.a("string");
        pm.expect(sc.name).to.be.a("string");
        pm.expect(sc.owner).to.be.a("string");
        pm.expect(sc.total_tracks).to.be.a("number");
      });
settings:
  version: auto
  requestTimeout: 0
order: 25000
