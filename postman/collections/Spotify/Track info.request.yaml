$kind: mcp-request
description: |-
  **Purpose:** track metadata by ID. Accepts a single string *or* a list.

  **Result:** one entry per requested ID. `popularity` is null — the restricted regime
  strips it.

  Several IDs work: a bare string, a one-element list and a multi-element list all return
  their tracks. The batch endpoint (`/v1/tracks?ids=`) is withheld from this app, so a
  multi-ID call is served by one upstream request per track rather than one for the whole
  set — correct results, but not the single-call efficiency the docstring describes.

  On the published PyPI build two or more IDs fail with
  `Playback is restricted for this content [playback_restricted]`; a single ID still works.
  If that is what you get, the build is older than the fix and you must loop the
  single-ID form.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_tracks",
      "arguments": {
        "track_ids": "6ADPS6h7kuqZwqekUrLTEp"
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("one track comes back for one id", function () {
        pm.expect(sc.tracks).to.be.an("array").with.lengthOf(1);
        pm.expect(sc.tracks[0].id).to.be.a("string");
        pm.expect(sc.tracks[0].name).to.be.a("string");
      });
settings:
  version: auto
  requestTimeout: 0
order: 24000
