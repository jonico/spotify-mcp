$kind: mcp-request
description: |-
  **Purpose:** track metadata by ID. Accepts a single string *or* a list.

  **Result:** one entry per requested ID. `popularity` is null — the restricted regime
  strips it.

  Several IDs work: a bare string, a one-element list and a multi-element list all return
  their tracks. The batch endpoint (`/v1/tracks?ids=`) is withheld from this app, so a
  multi-ID call is served by one upstream request per track rather than one for the whole
  set — correct results, but not the single-call efficiency the docstring describes.

  On the published PyPI build two or more IDs fail with
  `Playback is restricted for this content [playback_restricted]`; a single ID still works.
  If that is what you get, the build is older than the fix and you must loop the
  single-ID form.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_track_info",
      "arguments": {
        "track_ids": "6ADPS6h7kuqZwqekUrLTEp"
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 24000
