$kind: mcp-request
description: |-
  **Purpose:** `save_episodes`; it changes the live account.

  **Result:** Not executed. Documented only, as the other mutating requests in this collection are.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "save_episodes",
      "arguments": {
        "episode_ids": [
          "0000000000000000000000"
        ]
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 107000
