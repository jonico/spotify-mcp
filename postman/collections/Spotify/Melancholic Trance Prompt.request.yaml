$kind: mcp-request
description: |-
  **Purpose:** fetch the `create_mood_playlist` **prompt** with
  mood=melancholic, genre=trance, decade=90s.

  **Result** (read from the prompt implementation — prompts are pure string
  builders, so output is deterministic for given arguments): returns the instruction
  text "Create a Spotify playlist for a melancholic mood with trance music from the 90s",
  followed by the 3-step workflow (`search_music` → `create_playlist` →
  `add_tracks_to_playlist`), pagination tips, and a 15-20 song target.

  A prompt returns a template for the *client* to act on; it performs no Spotify calls
  itself.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "prompts/get",
    "params": {
      "name": "create_mood_playlist",
      "arguments": {
        "mood": "melancholic",
        "genre": "trance",
        "decade": "90s"
      }
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const text = res.messages && res.messages[0] && res.messages[0].content ? String(res.messages[0].content.text) : "";
      pm.test("prompt has a description and at least one message", function () {
        pm.expect(res.description).to.be.a("string").and.not.empty;
        pm.expect(res.messages).to.be.an("array").that.is.not.empty;
      });
      pm.test("first message is a text message with a role", function () {
        pm.expect(res.messages[0].role).to.be.a("string");
        pm.expect(res.messages[0].content.type).to.equal("text");
        pm.expect(text.length).to.be.above(0);
      });
      pm.test("arguments are rendered into the prompt", function () {
        ["melancholic", "trance", "90s"].forEach(function (v) { pm.expect(text, String(v)).to.include(String(v)); });
      });
      const info = res._meta && res._meta["io.modelcontextprotocol/serverInfo"];
      pm.test("result carries serverInfo with a semver version", function () {
        pm.expect(info, "serverInfo").to.be.an("object");
        pm.expect(info.name).to.be.a("string");
        pm.expect(info.version).to.match(/^\d+\.\d+\.\d+/);
      });
settings:
  version: auto
  requestTimeout: 0
order: 10000
