$kind: mcp-request
description: |-
  **Purpose:** read what is playing plus the upcoming queue.

  **Result:**
  `currently_playing` = "Und dann kommt ein Mensch" — Major Sunburn, followed by 12 queue
  entries alternating it with "Was Ist Freundschaft Wert (Major Sunburn Harmony Edit)".

  That cycling is a consequence of "Play MJRSBRN", not a bug: starting playback with an
  explicit `track_ids` list replaces the context with exactly those tracks, so Spotify
  pads the queue by repeating the set. Two tracks alternate; a single-track context
  repeats one track over and over. Run this after playing a playlist context to see a
  genuinely varied queue.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_queue",
      "arguments": {}
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 23000
