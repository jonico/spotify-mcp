$kind: mcp-request
description: |-
  **Purpose:** read what is playing plus the upcoming queue.

  **Result:**
  `currently_playing` = "Und dann kommt ein Mensch" — Major Sunburn, followed by 12 queue
  entries alternating it with "Was Ist Freundschaft Wert (Major Sunburn Harmony Edit)".

  That cycling is a consequence of "Play MJRSBRN", not a bug: starting playback with an
  explicit `track_ids` list replaces the context with exactly those tracks, so Spotify
  pads the queue by repeating the set. Two tracks alternate; a single-track context
  repeats one track over and over. Run this after playing a playlist context to see a
  genuinely varied queue.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_queue",
      "arguments": {}
    }
  }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.result;
      const sc = res.structuredContent || {};
      const errText = res.content && res.content[0] ? String(res.content[0].text).slice(0, 200) : "";
      pm.test("call succeeds (isError is not true)", function () { pm.expect(res.isError, errText).to.not.equal(true); });
      pm.test("returns structuredContent", function () { pm.expect(res.structuredContent).to.be.an("object"); });
      pm.test("answers within 5 s", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      pm.test("queue is a list and currently_playing is present", function () {
        pm.expect(sc.queue).to.be.an("array");
        pm.expect(sc).to.have.property("currently_playing");
      });
settings:
  version: auto
  requestTimeout: 0
order: 23000
