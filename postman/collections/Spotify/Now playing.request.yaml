$kind: mcp-request
description: |-
  **Purpose:** read the current playback state — track, device, volume, shuffle/repeat.

  **Result:** `is_playing: true`, "Raise Your Glass" — P!nk (*Raise Your Glass*,
  2010) on device `PM-MYKFWG6W19`, volume 100, `progress_ms: 177961`, shuffle off,
  repeat off.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_playback_state",
      "arguments": {}
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 2000
