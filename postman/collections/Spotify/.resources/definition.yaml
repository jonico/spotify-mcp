$kind: collection
description: |-
  Spotify MCP collection for playback control, content discovery, playlist browsing, and  
  user/library actions. Every request is an **AI (MCP) request** speaking JSON-RPC to  
  `uvx spotify-mcp-jamiew` over stdio, covering all 25 tools, 6 resources and 5 prompts the  
  server exposes.

  Credentials come from the **Spotify MCP** environment (`{{SPOTIFY_CLIENT_ID}}`,  
  `{{SPOTIFY_CLIENT_SECRET}}`, `{{SPOTIFY_REDIRECT_URI}}`) rather than being inlined per  
  request. Select that environment before running anything.

  ## Coverage

  | Surface | Covered | Notes |
  | --- | --- | --- |
  | Tools | 25 / 25 | 8 pre-existing, 17 added |
  | Resources | 6 / 6 | 1 pre-existing, 5 added |
  | Prompts | 5 / 5 | 2 pre-existing, 3 added |

  Requests whose description says "Not executed" mutate the live account (create/rename/
  reorder/unfollow/unlike, queue and device transfer). They are documented but deliberately
  never run. Everything else describes the response the request actually returns.

  ## Behaviour to expect

  The published PyPI build and the current upstream build differ. Five of the items under
  **Works** fail on the PyPI build that `uvx spotify-mcp-jamiew` installs; both builds report
  the same version number, so only a behavioural check distinguishes them. Everything under
  **Does not work** applies to both.

  ### Works

  - `get_artist_info` returns the artist. `top_tracks` is `[]` — Spotify withholds them.
  - `search_music` accepts `limit` above 10 and returns 10 rows with `"limit": 10`.
  - `get_track_info` accepts several IDs; three IDs return three tracks.
  - `control_playback` returns live state: `play` gives `is_playing: true` with the track,
      `next` gives the new track.
  - `get_top_items` honours `limit` — 5 returns 5 artists, 10 returns 10.
  - `get_playlist_info` reports a real `total_tracks`.

  ### Does not work

  - `get_user_playlists` returns `total_tracks: null` for every entry. Playlist size is not
      available from the list — page each playlist and count the rows returned.
  - `get_playlist_tracks` reports `total` as the returned page size, not the playlist length.
  - `search_music` can return `"total": 0` alongside populated `items` — a filtered search
      (`query: "I got that"`, `artist: "Kotorri"`) returned three tracks with `total` zero.
      Read `items`; never branch on `total`.
  - Artist and user objects come back with `genres: []` and `popularity`/`followers` null.
  - `add_tracks_to_playlist` takes `track_uris`, not `track_ids`.
  - Field filters inside `query` (`artist:Name`) are not honoured; use the `artist`, `album`,
      `year` and `genre` parameters instead.

  ## AI Workflow Requests

  Four `llm-request` items complement the raw `mcp-request` calls above: **Queue
  Similar Tracks**, **Build Discovery Playlist**, **Resume Liked Songs** and
  **Clean Up Duplicate Tracks AI Request**. Each hands a model a natural-language
  goal plus this server configured as an MCP tool source (via `mcpConfig`), and
  lets the model decide which tools to call and in what order - unlike the
  `prompts/get` requests above, which only fetch a prompt template rather than
  executing anything.

  Each has a matching top-level collection, `Spotify REST Workflow - <name>`, that
  pins down the literal Spotify Web API calls behind that same workflow - no LLM,
  no MCP server, just the HTTP requests `spotify_api.py`/`spotipy` would make,
  chained together with collection variables in the order the tools would be
  invoked.

  ## Provenance

  Documented and extended by Claude Code (Opus 5) on 2026-08-25 from the prompt below.

  This is a cleaned-up restatement, not the literal message that was typed. The original  
  took several rounds to pin down — where the collection lived, which client could execute  
  `mcp-request` items, which file format to use, how to sync, and what "link to vault  
  entries" meant in practice. The version recorded here folds those answers in, so it  
  should reproduce the same result in one pass:

  ```
  Document and complete the git-synced Postman collection at postman/collections/Spotify/
  (v3 YAML, *.request.yaml). Every request in it is an AI/MCP request against this repo's
  own server.
  1. Execute the existing requests and document each with its purpose and its actual
     result. Use the pre-connected `spotify` MCP server to do this — the Postman CLI skips
     `mcp-request` items as unsupported — and don't write your own runner script. Use the
     MCP resource reader for `resources/read`; there's no client tool for `prompts/get`, so
     document those from the `@mcp.prompt` implementations instead. Run the read-only
     requests for real. For requests that would mutate my Spotify account (create, rename,
     reorder, unfollow, unlike, queue, device transfer), write the documentation but don't
     run them, and say which ones you skipped. On the removal request, decline the
     elicitation — the confirmation prompt is the point, not the deletion.
  2. Close the coverage gap. Enumerate every @mcp.tool, @mcp.resource and @mcp.prompt in
     src/spotify_mcp/fastmcp_server.py and add one request per capability not yet covered.
     Then verify 100% coverage by diffing the decorators against the requests' JSON-RPC
     messages.
  3. Rewrite the collection description to include this prompt verbatim, a coverage table,
     and any server defects you hit while executing.
  4. Get the credentials out of the request files. SPOTIFY_CLIENT_ID,
     SPOTIFY_CLIENT_SECRET and SPOTIFY_REDIRECT_URI are inlined in plaintext in every one.
     Move them to a new environment at postman/environments/Spotify MCP.environment.yaml
     (YAML v3, not .postman_environment.json) and have each request reference
     {{SPOTIFY_CLIENT_ID}} and friends. In that environment, the two credentials should
     hold symbolic Postman Vault references — {{vault:spotify-mcp-client-id}} and
     {{vault:spotify-mcp-client-secret}} — because no API can create vault entries; I'll
     create those by hand. Validate with `postman environment lint`.
  5. Sync with `postman workspace push` when you're done. Don't create cloud entities
     through the Postman MCP create* tools.
  Flag anything you can't do rather than approximating it.

   ```
