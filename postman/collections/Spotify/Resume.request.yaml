$kind: mcp-request
description: |-
  **Purpose:** resume playback with no arguments — `action: play` and every other
  field null means "continue whatever is loaded" rather than "start something new".

  **Result:** `is_playing: true` from `progress_ms: 7922`, same track.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "control_playback",
      "arguments": {
        "action": "play",
        "track_ids": null,
        "context_uri": null,
        "position_ms": null,
        "volume_percent": null,
        "state": null,
        "device_id": null
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 5000
